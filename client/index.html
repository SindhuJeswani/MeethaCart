<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#4A2C1A" />
    <meta name="description" content="MeethaCart - Homemade cakes, bakes, and sweets from local home bakers in Pakistan." />

    <!-- Open Graph / Social Media Meta -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="MeethaCart - Homemade Bakery Marketplace" />
    <meta property="og:description" content="Homemade cakes, bakes, and sweets from local home bakers in Pakistan." />
    <meta property="og:image" content="/icon-512.png" />

    <title>MeethaCart</title>

    <!-- Prevent theme flash before first paint -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('meethacart-theme') || 'classic';
          document.documentElement.setAttribute('data-theme', saved);
        } catch (e) {}
      })();
    </script>

    <!-- Google Fonts for Classic, Sindhi Ajrak, and Bold Street Market themes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Noto+Naskh+Arabic:wght@400;600;700&family=Noto+Nastaliq+Urdu:wght@400;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;0,800;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Roboto+Slab:wght@400;600;700;800&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="antialiased min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
